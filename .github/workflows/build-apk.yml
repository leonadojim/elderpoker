name: Build Android APK

on:
  workflow_dispatch:   # 网页上手动点按钮触发
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (双架构编译占磁盘大；保留安卓SDK)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Cache buildozer build dir
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec', 'p4a-recipes/**') }}
          restore-keys: ${{ runner.os }}-buildozer-

      - name: Ensure Android SDK platform 33 on runner
        run: |
          ls "$ANDROID_HOME/platforms" || true
          if [ ! -d "$ANDROID_HOME/platforms/android-33" ]; then
            sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-33" "build-tools;34.0.0"
          fi
          # buildozer 只认老式 tools/bin/sdkmanager 路径，做相对软链兼容
          # （必须相对路径：绝对路径在容器内会指到挂载点之外）
          sudo ln -sfn cmdline-tools/latest "$ANDROID_HOME/tools"

      - name: Build APK (official buildozer docker image)
        run: |
          # 缓存里的venv可能带有损坏的pip（并发写残留），删掉强制重建
          rm -rf .buildozer/android/platform/*/build/venv
          # 配方变更时强制重建对应包和打包产物（p4a按已安装状态跳过）
          rm -rf .buildozer/android/platform/*/build/other_builds/pygame
          rm -rf .buildozer/android/platform/*/build/python-installs/*/*/pygame
          rm -rf .buildozer/android/platform/*/dists
          VENV=.buildozer/android/platform/build-arm64-v8a_x86_64/build/venv
          ok=0
          for i in 1 2 3; do
            if docker run --rm \
              -v "$GITHUB_WORKSPACE:/home/user/hostcwd" \
              -v "$ANDROID_HOME:/opt/android-sdk" \
              -e ANDROIDSDK=/opt/android-sdk \
              -e ANDROID_HOME=/opt/android-sdk \
              -e PIP_CONSTRAINT=/home/user/hostcwd/ci-constraints.txt \
              kivy/buildozer:latest android debug; then ok=1; break; fi
            echo "== 第 $i 次尝试失败，修复venv中的pip后重试 =="
            if [ -f "$VENV/bin/python" ]; then
              curl -sS https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
              sudo "$VENV/bin/python" /tmp/get-pip.py "pip==25.2" --force-reinstall || true
            fi
            sleep 20
          done
          [ "$ok" = 1 ]
          sudo chown -R "$USER:$USER" bin .buildozer || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elderpoker-apk
          path: bin/*.apk

  # 编译成功后自动在安卓模拟器里启动，抓取崩溃日志
  test-on-emulator:
    needs: build
    runs-on: ubuntu-latest   # KVM 加速 x86_64 模拟器，API30+ 镜像自带 arm64 指令翻译
    steps:
      - name: Free disk space (保留安卓SDK，其余清理)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="STATIC_ASSIGN=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@v4
        with:
          name: elderpoker-apk

      - name: Run app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35   # Android 15，与用户的新手机同代
          arch: x86_64    # 原生运行（APK含x86_64），不需要指令翻译
          target: google_apis
          emulator-boot-timeout: 1800
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: |
            adb install -r eldercards-*-debug.apk
            adb shell am start -n org.elderpoker.eldercards/org.kivy.android.PythonActivity
            sleep 30
            adb shell pidof org.elderpoker.eldercards && echo "APP_RUNNING" || echo "APP_NOT_RUNNING"
            adb logcat -d > logcat.txt
            adb shell run-as org.elderpoker.eldercards cat files/app.log > app.log 2>/dev/null || true
            adb shell run-as org.elderpoker.eldercards cat files/crash.log > crash.log 2>/dev/null || true

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: |
            logcat.txt
            app.log
            crash.log
