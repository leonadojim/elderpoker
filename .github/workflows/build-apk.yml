name: Build Android APK

on:
  workflow_dispatch:   # 网页上手动点按钮触发
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache buildozer build dir
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: ${{ runner.os }}-buildozer-

      - name: Build APK (official buildozer docker image)
        run: |
          ok=0
          for i in 1 2 3; do
            if docker run --rm -v "$GITHUB_WORKSPACE:/home/user/hostcwd" \
              kivy/buildozer:latest android debug; then ok=1; break; fi
            echo "== 第 $i 次尝试失败（多为谷歌SDK仓库波动），20秒后重试 =="
            sleep 20
          done
          [ "$ok" = 1 ]
          sudo chown -R "$USER:$USER" bin .buildozer || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elderpoker-apk
          path: bin/*.apk
