name: Build Android APK

on:
  workflow_dispatch:   # 网页上手动点按钮触发
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache buildozer build dir
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: ${{ runner.os }}-buildozer-

      - name: Ensure Android SDK platform 33 on runner
        run: |
          ls "$ANDROID_HOME/platforms" || true
          if [ ! -d "$ANDROID_HOME/platforms/android-33" ]; then
            sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-33" "build-tools;34.0.0"
          fi
          # buildozer 只认老式 tools/bin/sdkmanager 路径，做相对软链兼容
          # （必须相对路径：绝对路径在容器内会指到挂载点之外）
          sudo ln -sfn cmdline-tools/latest "$ANDROID_HOME/tools"

      - name: Build APK (official buildozer docker image)
        run: |
          # 缓存里的venv可能带有损坏的pip（之前失败run的残留），删掉强制重建
          rm -rf .buildozer/android/platform/build-arm64-v8a/build/venv
          ok=0
          for i in 1 2 3; do
            if docker run --rm \
              -v "$GITHUB_WORKSPACE:/home/user/hostcwd" \
              -v "$ANDROID_HOME:/opt/android-sdk" \
              -e ANDROIDSDK=/opt/android-sdk \
              -e ANDROID_HOME=/opt/android-sdk \
              kivy/buildozer:latest android debug; then ok=1; break; fi
            echo "== 第 $i 次尝试失败，20秒后重试 =="
            sleep 20
          done
          [ "$ok" = 1 ]
          sudo chown -R "$USER:$USER" bin .buildozer || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elderpoker-apk
          path: bin/*.apk

  # 编译成功后自动在安卓模拟器里启动，抓取崩溃日志
  test-on-emulator:
    needs: build
    runs-on: macos-14   # Apple Silicon，可硬件加速 arm64 模拟器
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: elderpoker-apk

      - name: Restart adb daemon (macOS runner 上 adb 偶发僵死)
        run: |
          adb kill-server || true
          sleep 2
          adb start-server
          adb devices

      - name: Run app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: arm64-v8a
          target: google_apis   # Apple Silicon 上 default target 没有 arm64 镜像，会启动超时
          script: |
            adb install -r eldercards-1.0.0-arm64-v8a-debug.apk
            adb shell am start -n org.elderpoker.eldercards/org.kivy.android.PythonActivity
            sleep 30
            adb shell pidof org.elderpoker.eldercards && echo "APP_RUNNING" || echo "APP_NOT_RUNNING"
            adb logcat -d > logcat.txt
            adb pull /sdcard/Android/data/org.elderpoker.eldercards/files/app.log || true

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: |
            logcat.txt
            app.log
